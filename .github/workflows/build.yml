name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        # .NET 10 is currently in preview, so we allow preview versions
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore PKHeX.slnx

    - name: Build
      run: dotnet build PKHeX.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test PKHeX.slnx --configuration Release --no-build --verbosity normal
